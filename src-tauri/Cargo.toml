[package]
name = "shadermind"
version = "0.1.0"
description = "GLSL 片段着色器实时预览器"
authors = ["ShaderMind"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shadermind_lib"
# 只做桌面版，去掉 iOS 用的 staticlib（单个 .lib 动辄 1 GB 以上）
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 自己的代码只保留行号表（.pdb 小很多）：panic/堆栈仍有文件和行号，调试器里看不到局部变量
[profile.dev]
debug = "line-tables-only"

# 依赖库不生成调试信息（.pdb 等），大幅缩小 target；自己的代码仍可正常调试
[profile.dev.package."*"]
debug = false
